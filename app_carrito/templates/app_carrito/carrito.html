<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrito | NutriFlow</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #eef7f6;
        }

        .contenedor {
            width: 500px;
            padding: 35px;
            text-align: center;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 18px #cccccc;
        }

        h1 {
            color: #8c55b6;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            color: white;
            background: #8c55b6;
            border-radius: 6px;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="contenedor">
        <h1>Bienvenido al Carrito</h1>

        <p>
            Aquí podrás consultar los productos seleccionados
            antes de realizar la compra.
        </p>

        <a href="/">Volver al inicio</a>
    </main>
</body>
</html>
